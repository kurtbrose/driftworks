</style></head><body><canvas id="sky" aria-label="Rotatable gas giant cubemap with eight independent lightning regions"></canvas><aside><small>DRIFTWORKS / SKYBOX STUDY</small><h1>Weather after dark</h1><p>A whole gas giant hemisphere. Eight buried storms; new bursts drift through the cloud belts.</p><button id="play">Pause</button> <button id="home">Whole hemisphere</button><label>Comparison<select id="mode"><option value="live">Live lightning</option><option value="dark">Unlit sky</option><option value="lit">All eight illuminated</option></select></label><label>Cloud palette<select id="palette"><option value="original">Original / ochre &amp; ivory</option><option value="cobalt">Cobalt &amp; white</option><option value="teal">Turquoise &amp; teal</option><option value="jade" selected>Jade &amp; ivory</option><option value="lavender">Lavender &amp; slate</option><option value="burgundy">Burgundy &amp; charcoal</option></select></label><label>Palette strength<input id="color-strength" aria-label="Palette strength" type="range" min="0" max="1" step="0.05" value="0.9"></label><label>Field of view<input id="fov" aria-label="Field of view" type="range" min="45" max="115" value="110"></label><label>Storm activity<input id="activity" aria-label="Storm activity" type="range" min="0.3" max="2" value="1" step="0.1"></label><button id="burst">Trigger all eight</button><p>Drag to look around. Wheel to zoom. Space to pause. The sky has no translation or parallax.</p><output id="status" role="status">Loading twelve cube facesâ€¦</output><p><a href="skybox-factory.html">Skybox factory</a></p></aside><script src="../src/asset-versions.js?v=6482e0ba7bb0"></script>
