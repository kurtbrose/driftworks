<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ellis sky continuity / Driftworks</title>
<script src="../src/asset-versions.js?v=a9bcdb819afe"></script>
<script>var skyStudyURL=new URL(location.href);skyStudyURL.searchParams.set('mission','ellis');skyStudyURL.searchParams.set('bridgeGrid','0');skyStudyURL.searchParams.set('bridgeOutline','0');history.replaceState(null,'',skyStudyURL);window.Driftworks=window.Driftworks||{};window.Driftworks.sim={METERS_PER_UNIT:60};</script>
<style>*{box-sizing:border-box}body{margin:0;background:#000;color:#d4edeb;font:14px system-ui}#viewer{position:fixed;inset:0}canvas{position:absolute;width:100%;height:100%}section{position:fixed;left:18px;bottom:18px;right:18px;background:#07151deb;border:1px solid #35545e;border-radius:10px;padding:16px}h1{font-size:19px;margin:0 0 8px}p{margin:7px 0;color:#abc1c2}.controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap}label{display:flex;gap:8px;align-items:center}button,input,select{font:inherit}button,select,input[type=number]{background:#102a34;color:#ddf0eb;border:1px solid #45636e;padding:7px;border-radius:4px}input[type=range]{width:230px}input[type=number]{width:105px}a{color:#9ee9dd}output{font:13px monospace}</style></head>
<body><div id="viewer" aria-label="Sky-only wormhole boundary study"></div><section><h1>Ellis sky continuity</h1><p>Sky only, with grids, warning outline and ships hidden. Scrub across 450 m and 600 m, or play at 1/100 flight speed.</p>
<div class="controls"><button id="play">Play</button><label>Distance <input id="distance" type="range" min="301" max="1200" step="0.001" value="590"><input id="exact" aria-label="Exact distance" type="number" min="301" max="1200" step="0.001" value="590"> m</label><label>Look <select id="view"><option value="0">Outward</option><option value="60" selected>Oblique outward</option><option value="90">Tangent</option><option value="120">Oblique inward</option><option value="180">Toward throat</option></select></label><label>Side <select id="side"><option value="0">Asteroid</option><option value="1">Rime</option></select></label><label>Speed <select id="speed"><option value="0.7">0.7 m/s · 1/100</option><option value="7">7 m/s</option><option value="70">70 m/s</option></select></label><button id="boundary">600 m</button><output id="readout"></output></div><p><a href="ellis-study.html">Ship observation lab</a> · <a href="flight.html?mission=ellis">Fly Ellis</a></p></section>
<script src="flight-missions.js?v=7d23e8c1a442"></script><script src="mission-ohio.js?v=55d50526f5e4"></script><script src="ellis-optics.js?v=0d8a4f429f2b"></script><script src="skybox.js?v=4bb6c1f68d87"></script>
<script>
(function(){
 const get=id=>document.getElementById(id),sky=window.Driftworks.flightSkybox.create(get('viewer'),{fov:90,optics:false});
 let radius=590,playing=false,last=0,direction=1;
 function setRadius(value){radius=Math.max(301,Math.min(1200,Number(value)||590));get('distance').value=String(radius);get('exact').value=radius.toFixed(3);}
 get('distance').oninput=e=>{playing=false;setRadius(e.target.value);};get('exact').oninput=e=>{playing=false;setRadius(e.target.value);};
 get('play').onclick=()=>{playing=!playing;};get('boundary').onclick=()=>{playing=false;setRadius(600);};
 function frame(now){
  const dt=last?Math.min(.05,(now-last)/1000):0;last=now;
  if(playing&&!document.hidden){if(radius>=650)direction=-1;if(radius<=550)direction=1;setRadius(radius+direction*Number(get('speed').value)*dt);}
  get('play').textContent=playing?'Pause':'Play';
  const region=Number(get('side').value),angle=Number(get('view').value)*Math.PI/180;
  const forward=[Math.cos(angle),Math.sin(angle),0];
  if(!document.hidden)sky.render({eye:[(region*12000+radius)/60,-2000/60,1550/60],right:[-Math.sin(angle),Math.cos(angle),0],up:[0,0,1],back:forward.map(v=>-v),region:region},1,false);
  get('readout').textContent=radius.toFixed(3)+' m · '+(radius<450?'inner lens':radius<600?'smooth transition':'flat exterior');
  requestAnimationFrame(frame);
 }
 requestAnimationFrame(frame);
}());
</script></body></html>
