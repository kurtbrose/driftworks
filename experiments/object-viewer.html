<div class="row actions"><button id="fit">Fit object</button><button id="spin" aria-pressed="false">Turntable</button></div>
<label class="check"><input id="engines" type="checkbox" checked> Engine effects</label>
<p><a id="fly" href="../experiments/flight.html">Open flight lab</a> · <button class="text" id="share">Copy view link</button></p>

</aside>
