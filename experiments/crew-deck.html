box(0,-.15,0,28,.3,36,'#344550');box(0,6,0,28,.3,36,'#202e3a');box(-14,3,0,.4,6,36,'#273b49');box(14,3,0,.4,6,36,'#273b49');box(0,3, -18,28,6,.4,'#263e4d');box(0,3,18,28,6,.4,'#273b49');
for(let z=-15;z<18;z+=6){for(const x of [-13.6,13.6]){box(x,3,z,.6,6,.65,'#49616d');box(x*.98,3.8,z,.15,.13,2.5,'#a3d6d3');}box(0,5.8,z,19,.08,.24,'#d5e4df');}
for(let z=-16;z<18;z+=2)box(0,.012,z,.1,.02,1,'#d3a45d');for(const x of [-7,7])box(x,.015,0,.08,.03,32,'#b69558');
box(0,2.6,-17.7,9,5,.15,'#172933');for(const x of [-4.7,4.7])box(x,2.6,-17.5,.2,5.2,.2,'#d2a062');
for(const x of [-10,10])for(const z of [-12,-5,3]){box(x,.65,z,2.6,1.3,2.2,'#526773',true);box(x,1.36,z,2.3,.1,2,'#788891');box(x,.7,z+1.12,.9,.3,.02,'#d3a45d');}
box(-4,1,-10,3,2,1.5,'#364b59',true);box(-4,2.05,-10,2.8,.1,1.4,'#77b1b0');
// A skeleton-aware clone: geometry, inverse bind matrices and clips remain shared.
function cloneRig(source){const copy=source.clone(true),map=new Map();function pair(a,b){map.set(a,b);a.children.forEach((child,i)=>pair(child,b.children[i]));}pair(source,copy);source.traverse(n=>{if(n.isSkinnedMesh){const c=map.get(n);c.skeleton=n.skeleton.clone();c.skeleton.bones=n.skeleton.bones.map(b=>map.get(b));c.bindMatrix.copy(n.bindMatrix);c.material=Array.isArray(n.material)?n.material.map(m=>m.clone()):n.material.clone();}});return copy;}
// Authored Quaternius head: original anatomy, UVs and source base-color maps.
let headTemplatePromise;
async function authoredHead(root,rig){
 if(!headTemplatePromise)headTemplatePromise=(async()=>{
  const base='../assets/characters/quaternius-universal-base-characters/';
  const data=await (await fetch(base+'runtime/female-head.json')).json();
  const maps={MI_Hair_2:'T_Hair_2_BaseColor.png',MI_Eyes:'T_Eye_Brown.png',MI_Superhero_Female:'T_Superhero_Female_Dark_BaseColor.png'};
  const template=new T.Group();
  for(const part of data.groups){
   const geometry=new T.BufferGeometry();geometry.setAttribute('position',new T.Float32BufferAttribute(part.positions,3));geometry.setAttribute('normal',new T.Float32BufferAttribute(part.normals,3));geometry.setAttribute('uv',new T.Float32BufferAttribute(part.uvs,2));
   const texture=await new T.TextureLoader().loadAsync(base+'original/Base Characters/Godot - UE/'+maps[part.material]);texture.flipY=false;texture.colorSpace=T.SRGBColorSpace;
   template.add(new T.Mesh(geometry,new T.MeshStandardMaterial({map:texture,roughness:part.material==='MI_Eyes'?.35:.85})));
  }

 })();
 const anchor=(await headTemplatePromise).clone(true);root.add(anchor);rig.getObjectByName('SpaceSuit_Head').visible=false;
 return {anchor,bone:rig.getObjectByName('Head')};
}
function poseFace(a,now){if(!a.face)return;const {anchor,bone}=a.face;
 a.root.updateMatrixWorld(true);anchor.position.copy(a.root.worldToLocal(bone.getWorldPosition(new T.Vector3())));

}
const actors=[],crewGroup=new T.Group();scene.add(crewGroup);let sourceBytes=0;
try{
 const response=await fetch('../assets/characters/catalog.json'),catalog=await response.json(),entry=catalog[0];
 const url='../assets/characters/'+entry.id+'/'+entry.models[0].path;
 const bytes=await (await fetch(url)).arrayBuffer();sourceBytes=bytes.byteLength;
 const gltf=await new GLTFLoader().parseAsync(bytes,new URL('../assets/characters/'+entry.id+'/original/',location.href).href);
 const sourceBounds=new T.Box3().setFromObject(gltf.scene),height=sourceBounds.max.y-sourceBounds.min.y;
 const specs=[['Jo / flight crew',-3,3,'navy','Your fighter is cleared. I’m waiting for the next flight roster.'],['Asha / engineering',-4,-7,'engineering','Same suit, different paint. Most of our spare parts are shared too.'],['Luis / rescue',4,-2,'rescue','Taking a lap before the next evacuation shuttle arrives.']];
 for(const [name,x,z,palette,line] of specs){const root=new T.Group(),rig=cloneRig(gltf.scene);root.add(rig);rig.scale.setScalar(1.8/height);rig.position.y=-sourceBounds.min.y*1.8/height;root.position.set(x,0,z);crewGroup.add(root);const materials=[];rig.traverse(n=>{if(n.material)materials.push(...(Array.isArray(n.material)?n.material:[n.material]));if(n.isSkinnedMesh)n.frustumCulled=false;});const paint=presets.find(p=>p.id===palette);createPalette(materials).apply(paint.primary,paint.accent,true);const mixer=new T.AnimationMixer(rig),clips=new Map(gltf.animations.map(c=>[c.name.split('|').pop(),c]));const actor={name,line,root,mixer,clips,action:null,mode:'',talk:0,patrol:name.startsWith('Luis'),origin:new T.Vector3(x,0,z)};actor.face=await authoredHead(root,rig);actors.push(actor);play(actor,actor.patrol?'Walk':'Idle');}
 $('enter').disabled=false;$('enter').textContent='Walk aboard';window.crewDeck={actors,renderer,scene,camera,sourceBytes,solids};
}catch(error){$('error').textContent='Could not load crew: '+error.message;}
function play(a,name){if(a.mode===name)return;a.action?.fadeOut(.2);a.action=a.mixer.clipAction(a.clips.get(name));a.action.reset().fadeIn(.2).play();a.mode=name;}
const keys=new Set();let yaw=0,pitch=0,drag=false,nearest=null,walking=false;
for(const [id,x,z,angle] of [['front',-3,4.05,0],['side',-1.9,3,Math.PI/2]])$(id).onclick=()=>{walking=false;document.exitPointerLock?.();camera.position.set(x,1.68,z);yaw=angle;pitch=0;camera.rotation.set(0,yaw,0);};
function look(dx,dy){yaw-=dx*.0025;pitch=T.MathUtils.clamp(pitch-dy*.0025,-1.3,1.3);camera.rotation.set(pitch,yaw,0);}
$('enter').onclick=()=>{walking=true;$('enter').textContent='Aboard · Esc to release';renderer.domElement.requestPointerLock()?.catch(()=>{$('error').textContent='Mouse capture unavailable here. Drag to look; WASD still moves.';});};
renderer.domElement.onpointerdown=e=>{drag=true;renderer.domElement.setPointerCapture(e.pointerId);};renderer.domElement.onpointerup=()=>drag=false;

$('crew').onchange=()=>crewGroup.visible=$('crew').checked;
function blocked(x,z){return Math.abs(x)>13.4||Math.abs(z)>17.4||solids.some(b=>Math.abs(x-b.x)<b.w/2+.3&&Math.abs(z-b.z)<b.d/2+.3)||(crewGroup.visible&&actors.some(a=>Math.hypot(x-a.root.position.x,z-a.root.position.z)<.55));}
function resize(){const w=innerWidth,h=innerHeight,scale=Number($('resolution').value);const divisor=scale===0?1:3*scale;renderer.setPixelRatio(scale===0?Math.min(devicePixelRatio,2):1);renderer.domElement.style.imageRendering=scale===0?'auto':'pixelated';renderer.setSize(Math.max(1,Math.round(w/divisor)),Math.max(1,Math.round(h/divisor)),false);camera.aspect=w/h;camera.updateProjectionMatrix();}addEventListener('resize',resize);$('resolution').onchange=resize;resize();
let last=performance.now(),samples=[],report=last;function frame(now){requestAnimationFrame(frame);const elapsed=now-last,dt=Math.min(.05,elapsed/1000);last=now;
 if(walking&&document.hasFocus()){const f=Number(keys.has('KeyW'))-Number(keys.has('KeyS')),r=Number(keys.has('KeyD'))-Number(keys.has('KeyA')),norm=Math.max(1,Math.hypot(f,r)),v=(keys.has('ShiftLeft')?4.5:2.5)*dt/norm,dx=(r*Math.cos(yaw)-f*Math.sin(yaw))*v,dz=(-f*Math.cos(yaw)-r*Math.sin(yaw))*v;if(!blocked(camera.position.x+dx,camera.position.z))camera.position.x+=dx;if(!blocked(camera.position.x,camera.position.z+dz))camera.position.z+=dz;}
 nearest=null;let distance=2.8;
 for(const a of actors){a.talk=Math.max(0,a.talk-dt);if(a.talk>0){a.root.rotation.y=Math.atan2(camera.position.x-a.root.position.x,camera.position.z-a.root.position.z);}else if(a.patrol){play(a,'Walk');const target=a.origin.clone();target.z+=Math.sin(now*.00022)*4;const delta=target.sub(a.root.position);if(delta.length()>.02){a.root.rotation.y=Math.atan2(delta.x,delta.z);a.root.position.addScaledVector(delta.clone().normalize(),Math.min(.85*dt,delta.length()));}}else play(a,'Idle');a.mixer.update(dt);poseFace(a,now);const d=a.root.position.distanceTo(camera.position);if(crewGroup.visible&&d<distance){distance=d;nearest=a;}}

 const start=performance.now();renderer.render(scene,camera);const submit=performance.now()-start;samples.push([elapsed,submit]);if(now-report>1000){const sorted=samples.map(s=>s[0]).sort((a,b)=>a-b),cpu=samples.map(s=>s[1]).sort((a,b)=>a-b);$('stats').textContent=`${renderer.domElement.width} × ${renderer.domElement.height} / ${renderer.info.render.calls} draws / ${renderer.info.render.triangles.toLocaleString()} triangles\nframe ${sorted[Math.floor(sorted.length*.5)].toFixed(1)} ms · p95 ${sorted[Math.floor(sorted.length*.95)].toFixed(1)} ms\nCPU submit ${cpu[Math.floor(cpu.length*.5)].toFixed(1)} ms · model ${(sourceBytes/1024).toFixed(0)} KiB shared`;samples=[];report=now;}}
