<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Target status bar preview · Driftworks</title>
<style>
body{margin:0;background:#10151e;color:#d8e1ed;font:16px system-ui}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:24px}p{color:#b2bdcd}nav{display:flex;gap:20px;flex-wrap:wrap;margin:20px 0}label{display:grid;gap:6px}button,select{padding:8px;background:#263344;color:#fff;border:1px solid #67768b;border-radius:4px}canvas{width:100%;height:380px;border:1px solid #536174;background:#05080d}a{color:#9ebce8}output{font-variant-numeric:tabular-nums}
</style>
<main><h1>Target status bar preview</h1><p>Live flight renderer, isolated from combat. Two 50 × 4 pixel bars below the target: shields above hull. Left: actual screen size. Right: 4× inspection view. Blue = shields; green = hull (amber below 50%, red below 25%).</p>
<nav>
<label>Shield <output id="shield-value">100%</output><input id="shield" type="range" min="0" max="100" value="100"></label>
<label>Hull <output id="hull-value">100%</output><input id="hull" type="range" min="0" max="100" value="100"></label>
<label>Backdrop<select id="backdrop"><option value="dark">Dark space</option><option value="busy">Bright combat</option><option value="light">Light surface</option></select></label>
<button id="damage">Take damage</button><button id="collapse">Collapse shields</button><button id="reset">Reset</button>
</nav><canvas id="preview" aria-label="Target shield and hull preview at actual size and four times magnification"></canvas>
<p id="readout" aria-live="polite"></p><p><a href="flight.html">Return to flight lab</a></p></main>
<script src="../src/asset-versions.js?v=37e5f610cee8"></script>
<script src="dom.js?v=c1d4287e76cd"></script><script src="flight-missions.js?v=2d314f747f30"></script><script src="mission-ohio.js?v=55d50526f5e4"></script><script src="flight-hud.js?v=e9a377daa830"></script>
<script>
(function () {
  'use strict';
  var canvas=document.getElementById('preview'),ctx=canvas.getContext('2d');
  var shield=document.getElementById('shield'),hull=document.getElementById('hull'),backdrop=document.getElementById('backdrop');
  var hud=window.Driftworks.flightHud,status=null;
  function set(s,h){shield.value=s;hull.value=h;}
  document.getElementById('damage').onclick=function(){set(Math.max(0,+shield.value-35),Math.max(0,+hull.value-20));};
  document.getElementById('collapse').onclick=function(){set(0,+hull.value);};
  document.getElementById('reset').onclick=function(){status=null;set(100,100);};
  function frame(ms){
    var w=canvas.clientWidth,h=380,dpr=window.devicePixelRatio||1;
    if(canvas.width!==Math.round(w*dpr)||canvas.height!==h*dpr){canvas.width=Math.round(w*dpr);canvas.height=h*dpr;}
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle=backdrop.value==='light'?'#9a9690':'#05080d';ctx.fillRect(0,0,w,h);
    if(backdrop.value==='busy'){
      var glow=ctx.createRadialGradient(w*.25,h*.5,0,w*.25,h*.5,120);glow.addColorStop(0,'#fff0ba');glow.addColorStop(.2,'#ad722c');glow.addColorStop(1,'#18212c');ctx.fillStyle=glow;ctx.fillRect(0,0,w*.5,h);
      ctx.fillStyle='#7b766c';for(var i=0;i<60;i++)ctx.fillRect((i*97)%w,(i*61)%h,2,2);
    }
    status=hud.targetStatus(status,{id:'preview',shield:+shield.value,maxShield:100,hp:+hull.value,maxHp:100},ms/1000);
    document.getElementById('shield-value').textContent=shield.value+'%';document.getElementById('hull-value').textContent=hull.value+'%';
    document.getElementById('readout').textContent='Shield '+shield.value+'% · Hull '+hull.value+'%';
    [1,4].forEach(function(scale,index){
      ctx.save();ctx.translate(w*(index===0?.25:.75),h*.42);ctx.scale(scale,scale);
      ctx.fillStyle='#606d7c';ctx.strokeStyle='#a7afb8';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(0,-15);ctx.lineTo(12,12);ctx.lineTo(0,6);ctx.lineTo(-12,12);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.strokeStyle='#ffe7a3';ctx.lineWidth=2;
      [-1,1].forEach(function(a){[-1,1].forEach(function(b){ctx.beginPath();ctx.moveTo(a*28,b*17);ctx.lineTo(a*28,b*28);ctx.lineTo(a*17,b*28);ctx.stroke();});});
      ctx.fillStyle='#ffe7a3';ctx.font='12px monospace';ctx.textAlign='center';ctx.fillText('243 m',0,33);
      hud.paintTargetStatus(ctx,0,0,status);ctx.restore();
    });
    ctx.fillStyle=backdrop.value==='light'?'#17202b':'#d8e1ed';ctx.font='14px system-ui';ctx.textAlign='center';ctx.fillText('Actual size · 1×',w*.25,28);ctx.fillText('Inspection · 4×',w*.75,28);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}());
</script></html>
