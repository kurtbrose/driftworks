<script src="../src/game.js?v=20260920-asteroid4"></script><script>
const app = new PIXI.Application({width:1100,height:720,backgroundAlpha:0,antialias:true,resolution:devicePixelRatio,autoDensity:true});
document.body.appendChild(app.view);
const names=['Ice','Volatiles','Metals','Silicates'];
const samples=[];
for(let i=0;i<20;i++){
 const a={id:'sample-'+i,radius:67,position:{x:110+(i%5)*220,y:80+Math.floor(i/5)*175},rotation:i*1.7,ore:100,oreInitial:100,angularVelocity:0.04};
 const g=new PIXI.Graphics();app.stage.addChild(g);Driftworks.game.paintAsteroid(g,a);samples.push({a,g});
 const v=Driftworks.game.asteroidVisualDescription(a);
 const label=new PIXI.Text(names[v.dominant],{fontFamily:'system-ui',fontSize:13,fill:0xc9d1d2});label.anchor.set(.5);label.position.set(a.position.x,a.position.y+77);app.stage.addChild(label);
}
let rotating=true;document.querySelector('button').onclick=function(){rotating=!rotating;this.textContent=rotating?'Pause rotation':'Resume rotation';};
app.ticker.add(delta=>{if(rotating)samples.forEach(({a,g})=>{a.rotation+=delta/60*.08;Driftworks.game.paintAsteroid(g,a);});});
</script></html>
