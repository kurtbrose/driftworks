<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mining pod - four-view study</title><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:#080d11;color:#e2d7b4;font:14px system-ui;overflow:hidden;display:flex;flex-direction:column;height:100dvh}
header{flex:none;padding:18px 24px;background:#101c24;border-bottom:1px solid #635733}
h1{font-size:20px;margin:0 0 12px}.study-controls{display:flex;align-items:center;gap:16px;flex-wrap:wrap}label{display:flex;gap:8px;align-items:center}a{color:#b9e4eb}p{color:#9cafb8;margin:10px 0 0;font-size:13px}
.views{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
.view{position:relative;min-width:0;min-height:0;overflow:hidden;border-bottom:1px solid #344853;border-right:1px solid #344853}
.viewport{position:absolute;inset:0;width:100%;height:100%}.view h2{position:absolute;z-index:3;top:14px;left:18px;font-size:14px;font-weight:500;margin:0;pointer-events:none}.fixed .viewport{pointer-events:none}
.view .hint{position:absolute;bottom:10px;left:18px;color:#8198a5;font-size:11px;pointer-events:none}.scene3d-controls{display:none}canvas{display:block}
@media(max-width:600px){header{padding:12px}h1{font-size:17px}.study-controls{gap:10px;font-size:12px}input[type=range]{width:85px}.view h2{left:10px;top:10px;font-size:12px}.view .hint{left:10px;font-size:10px}header p{display:none}}
</style>
<header><h1>Mining pod - four-view study</h1><div class="study-controls"><label for="design">Design <select id="design"><option value="fabricated" selected>04 - Fabricated plate hull</option><option value="pod">01 - Bean / equal clamps</option><option value="anchors">02 - Four anchors / four braces</option><option value="recessed">03 - Recessed / heavy crusher</option><option value="original">Original 3D interpretation</option></select></label><label for="deployment">Deployment <input id="deployment" type="range" min="0" max="1" step=".01" value="1"></label><label><input id="working" type="checkbox" checked> Run machinery</label><label><input id="grey" type="checkbox" checked> Grey silhouette</label><button id="reset">Reset orbit view</button><a href="../?renderer=3d">Back to game</a></div><p>Side, front and top stay fixed. Drag the raised view to swing around the pod; wheel to zoom, middle or Space + drag to pan.</p></header>
<main class="views">
<section class="view fixed"><h2>Side</h2><div id="side" class="viewport scene"></div></section>
<section class="view fixed"><h2>Front - mining head</h2><div id="front" class="viewport scene"></div></section>
<section class="view fixed"><h2>Top</h2><div id="top" class="viewport scene"></div></section>
<section class="view"><h2>Raised / orbit</h2><div id="orbit" class="viewport scene" aria-label="Interactive mining pod orbit view"></div><span class="hint">Drag to orbit / wheel to zoom</span></section>
</main>
<script>window.DRIFTWORKS_TEST_MODE=true;</script>
    <script src="../vendor/pixi/pixi.min.js?v=20260912-launch1"></script>
    <script src="../src/propulsion.js?v=20260920-population1"></script>
    <script src="../src/combat.js?v=20260921-sensor-track1"></script>
    <script src="../src/logistics.js?v=20260921-craft1"></script>
    <script src="../src/formations.js?v=20260920-population1"></script>
    <script src="../src/sim.js?v=20260922-cavern10"></script>
    <script src="../src/population.js"></script>
    <script src="../src/session.js"></script>
    <script src="../src/tactical/camera.js?v=20260920-population1"></script>
    <script src="../src/audio.js?v=20260920-population1"></script>
    <script src="../src/hud.js?v=20260922-cavern1"></script>
    <script src="../src/scene3d.js?v=20261010-navigation5"></script>
    <script src="../src/game.js?v=20261007-3d-geology2"></script>
<script>
(function(){
  var colors={ochre:[.83,.64,.29],steel:[.46,.53,.52],dark:[.10,.15,.17],light:[.89,.79,.49]};
  var poses={side:{yaw:0,tilt:Math.PI/2,height:7},front:{yaw:-Math.PI/2,tilt:Math.PI/2,height:7},top:{yaw:0,tilt:.001,height:7},orbit:{yaw:-.6,tilt:1,height:7}};
  var views=Object.keys(poses).map(function(id){
    var host=document.getElementById(id),world=Driftworks.sim.createInitialWorld();
    world.ships=[];world.asteroids=[];world.platforms=[];world.wrecks=[];world.packets=[];world.combat.drones=[];world.selectedShipIds=[];
    world.camera={x:0,y:0,zoom:1};
    var scene=Driftworks.scene3d.create(host,function(){return world;},function(w){world=w;},{study:true});
    scene.setOrbit(poses[id]);
    function fit(){world.camera={x:0,y:0,zoom:Math.max(.1,Math.min(host.clientWidth/(id==='orbit'?64:58),host.clientHeight/(id==='orbit'?58:46)))};}
    fit();new ResizeObserver(fit).observe(host);
    return {id:id,host:host,scene:scene,world:function(){return world;},fit:fit};
  });
  document.getElementById('reset').onclick=function(){var view=views[3];view.fit();view.scene.setOrbit(poses.orbit);};
  var previous=0,elapsed=0;
  function frame(now){
    requestAnimationFrame(frame);
    if(previous && now-previous<1000/30)return;
    elapsed+=previous?Math.min(.1,(now-previous)/1000):0;previous=now;
    var groups=Driftworks.scene3d.miningPlatformGeometry(Number(document.getElementById('deployment').value),elapsed,document.getElementById('working').checked,document.getElementById('design').value);
    var actors=Object.keys(groups).map(function(key){return {vertices:new Float32Array(groups[key]),color:document.getElementById('grey').checked?[.54,.56,.57]:colors[key]};});
    views.forEach(function(view){
      var world=view.world();world.elapsedSeconds=elapsed;
      if(view.id!=='orbit'){view.fit();view.scene.setOrbit(poses[view.id]);}
      view.scene.setStudyActors(actors);view.scene.sync(world);view.scene.render(world,1,0,0);
    });
  }
  requestAnimationFrame(frame);
})();
</script></html>
