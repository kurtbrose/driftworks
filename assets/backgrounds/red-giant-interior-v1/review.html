<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inside a red giant</title>
<style>body{margin:0;background:#250b05;color:#ffe5cd;font:14px system-ui}canvas{display:block;touch-action:none}aside{position:fixed;top:18px;left:18px;max-width:290px;padding:18px;background:#220d0cdb;border:1px solid #9d5739;border-radius:12px}h1{font-size:21px;margin:0 0 8px}p{line-height:1.5}button{color:inherit;background:#6c3022;border:1px solid #b8734c;border-radius:5px;padding:7px;margin:2px}label{display:block;margin-top:10px}</style>
<aside><h1>Inside a red giant</h1><p>A first study of the diffuse upper envelope. Drag to look through the glowing gas.</p><div id="views"></div><label><input id="spin" type="checkbox"> Slowly turn</label><label><input id="probe" type="checkbox"> Show foreground silhouette</label><p id="status">Loading six camera captures...</p></aside>
<script src="../../../src/asset-versions.js?v=9b793fab4822"></script>
<script type="module">
import * as THREE from '../../../vendor/three/build/three.module.js?v=c8211c69345d';
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.append(renderer.domElement);
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(65,1,.01,10);
camera.up.set(0,0,1);
new THREE.CubeTextureLoader().load(['px','nx','py','ny','pz','nz'].map(face=>'cube/'+face+'.png'),texture=>{
 texture.colorSpace=THREE.SRGBColorSpace;texture.flipY=false;scene.background=texture;
 document.getElementById('status').textContent='Six 512px faces / static atmosphere / draft';
},undefined,()=>{document.getElementById('status').textContent='Could not load cube faces';});
const probe=new THREE.Mesh(new THREE.ConeGeometry(.09,.3,5),new THREE.MeshBasicMaterial({color:0x321a17}));
probe.position.set(0,.7,-.13);probe.rotation.x=Math.PI/2;probe.visible=false;scene.add(probe);
document.getElementById('probe').onchange=e=>{probe.visible=e.target.checked;};
let yaw=Math.PI/2,pitch=0,drag=false,x=0,y=0,last=0;
for(const [label,a,b] of [['Forward',90,0],['Right',0,0],['Back',270,0],['Left',180,0],['Up',0,90],['Down',0,-90]]){
 const button=document.createElement('button');button.textContent=label;button.onclick=()=>{yaw=a*Math.PI/180;pitch=b*Math.PI/180;};document.getElementById('views').append(button);
}
renderer.domElement.onpointerdown=e=>{drag=true;x=e.clientX;y=e.clientY;renderer.domElement.setPointerCapture(e.pointerId);};
renderer.domElement.onpointermove=e=>{if(!drag)return;yaw-=(e.clientX-x)*.004;pitch=Math.max(-1.57,Math.min(1.57,pitch+(e.clientY-y)*.004));x=e.clientX;y=e.clientY;};
renderer.domElement.onpointerup=renderer.domElement.onpointercancel=()=>{drag=false;};
function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.1);last=now;
 if(document.getElementById('spin').checked&&!matchMedia('(prefers-reduced-motion: reduce)').matches)yaw+=dt*.07;
 renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 camera.lookAt(Math.cos(pitch)*Math.cos(yaw),Math.cos(pitch)*Math.sin(yaw),Math.sin(pitch));renderer.render(scene,camera);
}requestAnimationFrame(frame);
</script></html>
