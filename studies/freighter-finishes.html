<header><h2>Freight / Purpose and packaging</h2><label>Carrier <select id="ship"><option value="container">Compact container carrier</option><option value="mixed">Local container feeder</option><option value="fluid">Dedicated bulk tanker</option></select></label><br><label>Packaging <select id="packaging"><option value="compact">Purpose-built / compact</option><option value="frame">Previous frame / comparison</option></select></label><br><label>Previous frame <select id="structure" disabled><option value="sill">Closed service sills</option><option value="rail">Open perimeter rails</option><option value="lattice">Cross-braced comparison</option></select></label><br><label>Inspect <select id="detail"><option value="ship">Whole ship</option><option value="command">Command module</option><option value="engine">Single engine</option><option value="bank">Engine bank</option><option value="cassette">Cargo cassette</option><option value="valve">Tank valve branch</option><option value="pump">Pump + shield</option><option value="rcs">RCS mounting</option></select></label><br><label>Camera <select id="angle"><option value="0">Rear quarter</option><option value="1">Front quarter</option><option value="2">Underside</option><option value="3">Aft</option><option value="4">Front</option><option value="5">Side</option><option value="6">Top</option></select></label><br><button id="view">Next view</button><button id="shuffle">Shuffle cargo</button><label><input type="checkbox" id="paint" checked>Paint atlas</label><p id="stats"></p><small>Drag to orbit; scroll to zoom. Containers: tight exchangeable cassettes on a thrust spine. Tanker: permanent vessels, conformal collars and a protected transfer manifold. Previous frame retains the earlier design at the same metre scale.</small><p><a href="../experiments/flight.html?mission=convoy">Fly convoy</a></p></header>

<script type="module">
import * as T from 'three';
import {OrbitControls} from '../vendor/three/examples/jsm/controls/OrbitControls.js?v=b97879c74817';
import {part,buildFreighter,batchStatic,disposeBatch,setSurfaceTexture} from '../assets/ships/industrial-kit/kit.js?v=786aab9bd82d';
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(devicePixelRatio);renderer.setSize(Math.max(320,innerWidth-340),innerHeight);renderer.setClearColor(0x091015);document.body.append(renderer.domElement);
const scene=new T.Scene(),camera=new T.PerspectiveCamera(38,Math.max(320,innerWidth-340)/innerHeight,.1,3000),controls=new OrbitControls(camera,renderer.domElement);
scene.add(new T.HemisphereLight(0xcadce8,0x45443b,2));const key=new T.DirectionalLight(0xffeed1,3);key.position.set(-60,90,55);scene.add(key);const fill=new T.DirectionalLight(0x779dbd,1.8);fill.position.set(40,-35,-50);scene.add(fill);
const texture=await new T.TextureLoader().loadAsync(window.Driftworks.assetUrl('../assets/ships/industrial-kit/panels.png'));setSurfaceTexture(texture);let ship,center=new T.Vector3(),radius=50,view=0,cargoSeed=Math.floor(Math.random()*4093);
function frame(){const offsets=[[1,.65,1],[-1,.3,1],[.5,-.8,1],[1,.1,0],[-1,.05,0],[0,.05,1],[.001,1,0]];document.querySelector('#angle').value=String(view%offsets.length);camera.position.copy(center).add(new T.Vector3(...offsets[view%offsets.length]).normalize().multiplyScalar(radius*3.4/Math.min(1,camera.aspect)));controls.target.copy(center);controls.update();}
function rebuild(){if(ship){scene.remove(ship);disposeBatch(ship);}let source=buildFreighter(document.querySelector('#ship').value,{cargoSeed,packaging:document.querySelector('#packaging').value,treatment:document.querySelector('#structure').value});const detailControl=document.querySelector('#detail'),fluid=document.querySelector('#ship').value==='fluid',compact=document.querySelector('#packaging').value==='compact';document.querySelector('#shuffle').textContent=fluid?'Shuffle fleet':'Shuffle cargo';detailControl.querySelector('[value=valve]').disabled=!fluid||!compact;detailControl.querySelector('[value=pump]').disabled=!fluid||!compact;detailControl.querySelector('[value=cassette]').disabled=fluid||!compact;detailControl.querySelector('[value=rcs]').disabled=!compact;if(detailControl.selectedOptions[0].disabled)detailControl.value='ship';const detail=detailControl.value;if(detail==='command')source=(source.getObjectByName('freight command module')||source.children.find(o=>o.userData.part==='cabin'))?.clone()||source;else if(detail==='engine')source=part('engine');else if(detail==='cassette')source=source.getObjectByName('exchangeable cargo cassette')?.clone()||source;else if(detail==='valve')source=source.getObjectByName('tank transfer branch')?.clone()||source;else if(detail==='pump'){const pump=new T.Group(),end=source.userData.payloadEnd;source.children.filter(o=>['valve impact shield','shield standoff','transfer port collar','capped transfer port'].includes(o.name)||o.userData.mountKind==='pump'||(o.userData.part==='service'&&Math.abs(o.position.x-end-1)<1e-6)).forEach(o=>pump.add(o.clone()));source=pump;}else if(detail==='rcs')source=source.getObjectByName('RCS mounting assembly')?.clone()||source;else if(detail==='bank'){const bank=new T.Group(),end=source.userData.payloadEnd??source.userData.structuralLength-7;source.children.filter(o=>o.position.x>=end+.05||o.name==='shield standoff').forEach(o=>bank.add(o.clone()));source=bank;}ship=batchStatic(source);scene.add(ship);const bounds=new T.Box3().setFromObject(ship),compare=new T.Box3().setFromObject(buildFreighter(document.querySelector('#ship').value,{packaging:document.querySelector('#packaging').value==='frame'?'compact':'frame'}));const common=document.querySelector('#detail').value==='ship'?bounds.clone().union(compare):bounds.clone();common.getCenter(center);radius=common.getSize(new T.Vector3()).length()/2;document.querySelector('#stats').textContent=ship.children.length+' material batches / '+ship.children.reduce((n,m)=>n+m.geometry.attributes.position.count/3,0).toLocaleString()+' triangles / '+bounds.getSize(new T.Vector3()).toArray().map(v=>v.toFixed(1)).join(' x ')+' m (L / H / W)';frame();}
document.querySelector('#packaging').onchange=()=>{document.querySelector('#structure').disabled=document.querySelector('#packaging').value!=='frame';rebuild();};document.querySelector('#detail').onchange=rebuild;document.querySelector('#ship').onchange=rebuild;document.querySelector('#structure').onchange=rebuild;document.querySelector('#angle').onchange=e=>{view=Number(e.target.value);frame();};document.querySelector('#shuffle').onclick=()=>{cargoSeed=Math.floor(Math.random()*4093);rebuild();};document.querySelector('#view').onclick=()=>{view++;frame();};document.querySelector('#paint').onchange=e=>{ship.traverse(o=>{if(o.isMesh&&o.material.color.getHex()===0xffffff){o.material.map=e.target.checked?texture:null;o.material.needsUpdate=true;}});};
window.onresize=()=>{camera.aspect=Math.max(320,innerWidth-340)/innerHeight;camera.updateProjectionMatrix();renderer.setSize(Math.max(320,innerWidth-340),innerHeight);};rebuild();renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);});
</script></html>
