<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Freighter finishes / Driftworks</title>
<style>body{margin:0;background:#091015;color:#dae1d9;font:14px monospace}header{position:absolute;z-index:2;padding:20px;background:#091015e8;max-width:430px}select,button{padding:8px;background:#223139;color:inherit;border:1px solid #53656b;margin:4px}canvas{display:block}small{display:block;line-height:1.5;color:#abbab7}</style>
<header><h2>DW-14 / Freight treatments</h2><label>Carrier <select id="ship"><option value="container">Paired container carrier</option><option value="mixed">Mixed single spine</option><option value="fluid">Paired bulk tanker</option></select></label><br><label>Structure <select id="structure"><option value="sill">Closed service sills</option><option value="rail">Open perimeter rails</option><option value="lattice">Cross-braced comparison</option></select></label><br><button id="view">Next view</button><label><input type="checkbox" id="paint" checked>Paint atlas</label><p id="stats"></p><small>Drag to orbit; scroll to zoom. Same metre scale, DW-14 locks and shared paint atlas. Surface detail is baked into color pixels. Flight uses sills on container carriers and rails on mixed/fluid ships.</small><p><a href="../experiments/flight.html?mission=convoy">Fly convoy</a></p></header>

<script type="importmap">{"imports":{"three":"../vendor/three/build/three.module.js?v=c8211c69345d"}}</script>
<script type="module">
import * as T from 'three';
import {OrbitControls} from '../vendor/three/examples/jsm/controls/OrbitControls.js?v=b97879c74817';
import {buildFreighter,batchStatic,disposeBatch,setSurfaceTexture} from '../assets/ships/industrial-kit/kit.js?v=8cd59c051bcb';
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(devicePixelRatio);renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x091015);document.body.append(renderer.domElement);
const scene=new T.Scene(),camera=new T.PerspectiveCamera(38,innerWidth/innerHeight,.1,3000),controls=new OrbitControls(camera,renderer.domElement);
scene.add(new T.HemisphereLight(0xcadce8,0x45443b,2));const key=new T.DirectionalLight(0xffeed1,3);key.position.set(-60,90,55);scene.add(key);const fill=new T.DirectionalLight(0x779dbd,1.8);fill.position.set(40,-35,-50);scene.add(fill);
const texture=await new T.TextureLoader().loadAsync('../assets/ships/industrial-kit/panels.png');setSurfaceTexture(texture);let ship,center=new T.Vector3(),radius=50,view=0;
function frame(){const offsets=[[1,.65,1],[-1,.3,1],[.5,-.8,1],[1,.1,0]];camera.position.copy(center).add(new T.Vector3(...offsets[view%4]).normalize().multiplyScalar(radius*2.4));controls.target.copy(center);controls.update();}
function rebuild(){if(ship){scene.remove(ship);disposeBatch(ship);}const source=buildFreighter(document.querySelector('#ship').value,{treatment:document.querySelector('#structure').value});ship=batchStatic(source);scene.add(ship);const bounds=new T.Box3().setFromObject(ship);bounds.getCenter(center);radius=bounds.getSize(new T.Vector3()).length()/2;document.querySelector('#stats').textContent=ship.children.length+' material batches / '+ship.children.reduce((n,m)=>n+m.geometry.attributes.position.count/3,0).toLocaleString()+' triangles';frame();}
document.querySelector('#ship').onchange=rebuild;document.querySelector('#structure').onchange=rebuild;document.querySelector('#view').onclick=()=>{view++;frame();};document.querySelector('#paint').onchange=e=>{ship.traverse(o=>{if(o.isMesh&&o.material.color.getHex()===0xffffff){o.material.map=e.target.checked?texture:null;o.material.needsUpdate=true;}});};
window.onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);};rebuild();renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);});
</script></html>
