<!doctype html><meta charset="utf-8"><title>Ellis WebGL availability</title><h1>WebGL availability check</h1><canvas id="one" width="64" height="64"></canvas><canvas id="two" width="64" height="64"></canvas><pre id="result"></pre><script src="../src/asset-versions.js?v=5f7926eb997e"></script>
<script>
const rows=['webgl','webgl2'].map((type,i)=>{const c=document.getElementById(i?'two':'one');try{const gl=c.getContext(type);if(!gl)return {type,available:false};gl.clearColor(.1,.6,.3,1);gl.clear(gl.COLOR_BUFFER_BIT);const ext=gl.getExtension('WEBGL_debug_renderer_info');return {type,available:true,lost:gl.isContextLost(),size:[gl.drawingBufferWidth,gl.drawingBufferHeight],renderer:ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER)};}catch(e){return {type,error:String(e)};}});document.getElementById('result').textContent=JSON.stringify(rows,null,2);
</script>
